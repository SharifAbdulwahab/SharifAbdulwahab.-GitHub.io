 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Parents - SchoolEase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4ff;
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            float: none !important;
            position: static !important;
        }

        header {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 20px;
            width: 100%;
            float: none !important;
            position: static !important;
        }

        .back-btn {
            display: block;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 15px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: bold;
            float: none !important;
            position: static !important;
        }
        .back-btn:hover { text-decoration: underline; }

        .container {
            background: white !important;
            padding: 20px !important;
            border-radius: 10px !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important;
            width: 100% !important;
            max-width: 1000px !important;
            margin: 0 auto !important;
            overflow-x: auto;
            float: none !important;
            position: static !important;
            top: auto !important;
            right: auto !important;
            left: auto !important;
        }

        .search-box {
            width: 100% !important;
            max-width: 400px;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            float: none !important;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2563eb; color: white; padding: 12px; text-align: left; white-space: nowrap; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8fafc; }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-right: 10px;
            margin-top: 10px;
            float: none !important;
        }
        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            color: white;
            font-weight: bold;
        }
        .edit-btn { background: #f59e0b; }
        .delete-btn { background: #ef4444; }

        /* Tablet and below */
        @media (max-width: 768px) {
            body { padding: 10px !important; }
            .container { padding: 15px !important; border-radius: 8px; }
            h2 { font-size: 1.3rem; }
        }

        /* Phones: table becomes a stack of vertical cards */
        @media (max-width: 600px) {
            .search-box { max-width: 100% !important; }

            table, thead, tbody, th, td, tr {
                display: block;
                width: 100%;
            }

            thead {
                display: none; /* hide the horizontal header row */
            }

            tbody tr {
                border: 1px solid #e2e8f0;
                border-radius: 10px;
                margin-bottom: 15px;
                padding: 10px;
                background: #f9fafc;
            }

            tbody td {
                border-bottom: none;
                padding: 8px 6px;
                text-align: left;
                position: relative;
                padding-left: 45%;
            }

            tbody td::before {
                content: attr(data-label);
                position: absolute;
                left: 6px;
                width: 40%;
                font-weight: bold;
                color: #1d4ed8;
                white-space: nowrap;
            }

            tbody td:last-child {
                padding-left: 6px;
                text-align: center;
            }
            tbody td:last-child::before {
                content: "";
                position: static;
            }

            .btn { width: 100%; text-align: center; margin-right: 0; }
            .btn-small { padding: 8px 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

<header class="topbar"></header>

<div class="container">
    <h2>Parents List</h2>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search parent or student name..." onkeyup="searchParents()">

    <div style="overflow-x:auto;">
        <table id="parentsTable">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Parent Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="parentsList">
            </tbody>
        </table>
    </div>

    <a href="parents.html" class="btn">+ Add New Parent</a>
</div>

<script>
    let parents = JSON.parse(localStorage.getItem('parents')) || [];

    function displayParents(list) {
        const tbody = document.getElementById('parentsList');
        tbody.innerHTML = "";

        if(list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">No parents found</td></tr>`;
            return;
        }

        list.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td data-label="Student Name">${p.studentName}</td>
                    <td data-label="Parent Name">${p.parentName}</td>
                    <td data-label="Phone">${p.phone}</td>
                    <td data-label="Email">${p.email}</td>
                    <td data-label="Action">
                        <button class="btn-small edit-btn" onclick="editParent(${p.id})">Edit</button>
                        <button class="btn-small delete-btn" onclick="deleteParent(${p.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    function searchParents() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = parents.filter(p => 
            p.studentName.toLowerCase().includes(query) || 
            p.parentName.toLowerCase().includes(query)
        );
        displayParents(filtered);
    }

    function deleteParent(id) {
        if(confirm("Are you sure you want to delete this parent?")) {
            parents = parents.filter(p => p.id !== id);
            localStorage.setItem('parents', JSON.stringify(parents));
            displayParents(parents);
        }
    }

    function editParent(id) {
        const parent = parents.find(p => p.id === id);
        if(parent) {
            localStorage.setItem('editParent', JSON.stringify(parent));
            window.location.href = "parents.html?edit=" + id;
        }
    }

    displayParents(parents);
</script>

</body>
</html>
