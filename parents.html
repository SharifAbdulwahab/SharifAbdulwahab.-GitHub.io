 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents - SchoolEase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4ff;
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            float: none !important;
            position: static !important;
        }

        .back-btn {
            display: block;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: bold;
            float: none !important;
            position: static !important;
        }
        .back-btn:hover { text-decoration: underline; }

        h1 {
            text-align: center;
            color: #1d4ed8;
            margin: 10px 0;
            float: none !important;
            position: static !important;
            width: 100%;
        }

        header {
            text-align: center;
            color: #2563eb;
            margin-bottom: 20px;
            width: 100%;
            float: none !important;
            position: static !important;
        }

        .container {
            background: white !important;
            padding: 25px !important;
            border-radius: 10px !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important;
            width: 100% !important;
            max-width: 500px !important;
            margin: 0 auto !important;
            float: none !important;
            position: static !important;
            top: auto !important;
            right: auto !important;
            left: auto !important;
        }

        .container h2 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100% !important;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            float: none !important;
        }

        button {
            width: 100% !important;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            float: none !important;
        }
        button:hover { background: #1d4ed8; }

        #message {
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body { padding: 10px !important; }
            .container { padding: 18px !important; border-radius: 8px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<a href="viewparents.html" class="back-btn">← Back to View parent</a>
<h1>SCHOOLEASE</h1>

<header>
    <p>Parents Information</p>
</header>

<div class="container">
    <h2>Parent Details</h2>

    <input type="text" id="studentName" placeholder="Student Name"><br><br>

    <input type="text" id="parentName" placeholder="Parent Name"><br><br>

    <input type="tel" id="phone" placeholder="Parent Phone Number"><br><br>

    <input type="email" id="email" placeholder="Parent Email"><br><br>

    <button onclick="saveParent()">Save Parent</button>

    <br><br>

    <div id="message"></div>

    <br>

</div>

<script src="parents.js"></script>

</body>
</html>
