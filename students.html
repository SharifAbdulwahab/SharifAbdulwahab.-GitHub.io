  <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SchoolEase | Student Registration</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:linear-gradient(135deg,#eef5ff,#dbeafe,#f8fbff);
    color:#333;
}

.topbar{
    background:linear-gradient(135deg,#0f4ecf,#2563eb);
    color:#fff;
    text-align:center;
    padding:35px 20px;
    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.topbar h1{
    font-size:2.2rem;
    margin-bottom:8px;
}

.topbar p{
    font-size:1.1rem;
    opacity:.95;
}

.back-btn{
    display:inline-block;
    margin:20px;
    padding:12px 20px;
    background:#fff;
    color:#2563eb;
    text-decoration:none;
    font-weight:700;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
    transition:.3s;
}

.back-btn:hover{
    background:#2563eb;
    color:#fff;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto 40px;
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.container h2{
    color:#1847b8;
    text-align:center;
    margin-bottom:25px;
}

.student-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.student-form label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
}

.student-form input,
.student-form select,
.student-form textarea{
    width:100%;
    padding:14px;
    border:2px solid #dbe7ff;
    border-radius:12px;
    background:#f8fbff;
    font-size:15px;
    transition:.3s;
}

.student-form input:focus,
.student-form select:focus,
.student-form textarea:focus{
    outline:none;
    border-color:#2563eb;
    background:#fff;
    box-shadow:0 0 12px rgba(37,99,235,.18);
}

.student-form textarea{
    resize:vertical;
}

.full-width{
    grid-column:1 / -1;
}

.button-group{
    grid-column:1 / -1;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:10px;
}

.btn{
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#0b4fd6);
    color:#fff;
    padding:15px 28px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

#message{
    grid-column:1 / -1;
    text-align:center;
    color:green;
    margin-top:10px;
}

@media(max-width:768px){

.student-form{
    grid-template-columns:1fr;
}

.button-group{
    flex-direction:column;
}

.btn{
    width:100%;
}

}

</style>

</head>

<body>

<header class="topbar">

<h1>
<i class="fa-solid fa-school"></i>
SchoolEase
</h1>

<p>Student Registration</p>

</header>

<a href="dashboard.html" class="back-btn">
← Back to Dashboard
</a>

<div class="container">

<h2>
<i class="fa-solid fa-user-graduate"></i>
Register New Student
</h2>

<div class="student-form">

<div class="full-width">
<label>Student Passport</label>
<input type="file" id="studentPhoto" accept="image/*">
</div>

<div>
<label>Student ID</label>
<input type="text" id="studentId" placeholder="Auto Generated" readonly>
</div>

<div>
<label>Student Name</label>
<input type="text" id="studentName" placeholder="Enter Student Name">
</div>

<div>
<label>Age</label>
<input type="number" id="studentAge" placeholder="Enter Age">
</div>

<div>
<label>Gender</label>
<select id="studentGender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="full-width">
<label>Class</label>

<select id="studentClass">

<option value="">Select Class</option>

<option>Nursery1</option>
<option>Nursery2</option>
<option>PRIMARY1A</option>
<option>PRIMARY1B</option>
<option>PRIMARY2A</option>
<option>PRIMARY2B</option>
<option>PRIMARY3A</option>
<option>PRIMARY3B</option>
<option>PRIMARY4</option>
<option>JSS1A</option>
<option>JSS1B</option>
<option>JSS2A</option>
<option>JSS2B</option>
<option>JSS3A</option>
<option>JSS3B</option>
<option>SS1A</option>
<option>SS1B</option>
<option>SS2A</option>
<option>SS2B</option>
<option>SS3A</option>
<option>SS3B</option>

</select>

</div><div>
<label>Parent/Guardian Name</label>
<input
type="text"
id="parentName"
placeholder="Enter Parent/Guardian Name">
</div>

<div>
<label>Parent Phone Number</label>
<input
type="tel"
id="parentPhone"
placeholder="Enter Parent Phone Number">
</div>

<div class="full-width">
<label>Parent Email</label>
<input
type="email"
id="parentEmail"
placeholder="Enter Parent Email">
</div>

<div class="full-width">
<label>Home Address</label>
<textarea
id="studentAddress"
rows="4"
placeholder="Enter Home Address"></textarea>
</div>

<div class="button-group">

<button
type="button"
onclick="registerStudent()"
class="btn">

<i class="fa-solid fa-user-plus"></i>

Register Student

</button>

<button
type="reset"
class="btn">

<i class="fa-solid fa-eraser"></i>

Clear Form

</button>

</div>

<h3 id="message"></h3>

</div>

<hr>

<h2>

<i class="fa-solid fa-magnifying-glass"></i>

Search Student

</h2>

<input
type="text"
id="searchStudent"
placeholder="Search by Student ID or Student Name">

<hr>

<div class="summary">

<div class="card">

<h2 id="totalStudents">0</h2>

<p>Total Students</p>

</div>

<div class="card">

<h2 id="maleStudents">0</h2>

<p>Male Students</p>

</div>

<div class="card">

<h2 id="femaleStudents">0</h2>

<p>Female Students</p>

</div>

</div>

<h2>

<i class="fa-solid fa-table"></i>

Registered Students

</h2>

<div class="table-container">

<table id="studentTable">

<thead>

<tr>

<th>Photo</th>

<th>Student ID</th>

<th>Student Name</th>

<th>Age</th>

<th>Gender</th>

<th>Class</th>

<th>Parent Name</th>

<th>Phone</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<!-- Students will be loaded here by students.js --></tbody>

</table>

</div>

</div>

<footer class="footer">

<p>
© 2026 SchoolEase School Management System
</p>

</footer>

<script src="students.js"></script>

</body>

</html>
