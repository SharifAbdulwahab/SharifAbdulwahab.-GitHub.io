<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SchoolEase | Student Registration</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    background:linear-gradient(135deg,#eef4ff,#dfeeff,#f8fbff);

    color:#333;

    min-height:100vh;

    line-height:1.6;

}

/*======================
HEADER
=======================*/

.topbar{

    background:linear-gradient(135deg,#0b4fd6,#2563eb);

    color:#fff;

    padding:35px 20px;

    text-align:center;

    border-bottom-left-radius:35px;

    border-bottom-right-radius:35px;

    box-shadow:0 10px 25px rgba(0,0,0,.18);

}

.topbar h1{

    font-size:2.2rem;

    font-weight:700;

    letter-spacing:1px;

}

.topbar h1 i{

    margin-right:10px;

}

.topbar p{

    margin-top:8px;

    opacity:.95;

    font-size:1.1rem;

}

/*======================
BACK BUTTON
=======================*/

.back-btn{

    display:inline-block;

    margin:20px;

    text-decoration:none;

    color:#2563eb;

    font-weight:700;

    background:#fff;

    padding:12px 18px;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.1);

    transition:.3s;

}

.back-btn:hover{

    transform:translateX(-5px);

    background:#2563eb;

    color:#fff;

}

/*======================
MAIN CONTAINER
=======================*/

.container{

    width:95%;

    max-width:1150px;

    margin:20px auto 40px;

    background:#fff;

    border-radius:25px;

    padding:35px;

    box-shadow:0 15px 35px rgba(0,0,0,.12);

}

/*======================
HEADINGS
=======================*/

.container h2{

    text-align:center;

    color:#1847b8;

    margin-bottom:25px;

    font-size:30px;

}

.container h2 i{

    margin-right:8px;

}

.container h3{

    text-align:center;

    margin-top:20px;

    color:#16a34a;

}

/*======================
FORM
=======================*/

.student-form{

    display:flex;

    flex-direction:column;

    gap:16px;

}

.student-form label{

    font-weight:600;

    color:#444;

    margin-bottom:-8px;

}

.student-form input,

.student-form select,

.student-form textarea{

    width:100%;

    padding:15px;

    border:none;

    outline:none;

    background:#f7faff;

    border:2px solid #dce7ff;

    border-radius:14px;

    font-size:16px;

    transition:.35s;

}

.student-form input:focus,

.student-form select:focus,

.student-form textarea:focus{

    background:#fff;

    border-color:#2563eb;

    box-shadow:0 0 15px rgba(37,99,235,.18);

}

textarea{

    resize:vertical;

    min-height:120px;

}

/*======================
BUTTONS
=======================*/

.button-group{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    justify-content:center;

    margin-top:20px;

}

.btn{

    border:none;

    cursor:pointer;

    padding:15px 28px;

    border-radius:12px;

    font-size:16px;

    font-weight:700;

    color:#fff;

    background:linear-gradient(135deg,#2563eb,#0b4fd6);

    transition:.35s;

    box-shadow:0 8px 18px rgba(37,99,235,.25);

}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:0 15px 25px rgba(37,99,235,.3);

}

.btn i{

    margin-right:8px;

}

/*======================
SEARCH BOX
=======================*/

#searchStudent{

    width:100%;

    margin:20px 0;

    padding:15px;

    border-radius:14px;

    border:2px solid #dce7ff;

    background:#f7faff;

    font-size:16px;

    transition:.3s;

}

#searchStudent:focus{

    border-color:#2563eb;

    background:#fff;

    box-shadow:0 0 15px rgba(37,99,235,.18);

}

/*======================
DIVIDER
=======================*/

hr{

    border:none;

    height:2px;

    background:#dbe7ff;

    margin:35px 0;

}/*======================
SUMMARY CARDS
=======================*/

.summary{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin:30px 0;

}

.card{

    background:linear-gradient(135deg,#2563eb,#4f8cff);

    color:#fff;

    text-align:center;

    padding:25px;

    border-radius:18px;

    box-shadow:0 12px 25px rgba(37,99,235,.25);

    transition:.35s;

}

.card:hover{

    transform:translateY(-8px);

}

.card h2{

    color:#fff;

    margin-bottom:8px;

    font-size:40px;

}

.card p{

    font-size:18px;

}

/*======================
TABLE
=======================*/

.table-container{

    overflow-x:auto;

    margin-top:20px;

    border-radius:18px;

    box-shadow:0 8px 25px rgba(0,0,0,.08);

}

table{

    width:100%;

    border-collapse:collapse;

    background:#fff;

}

thead{

    background:linear-gradient(135deg,#0b4fd6,#2563eb);

    color:#fff;

}

th{

    padding:18px;

    font-size:15px;

    text-transform:uppercase;

    letter-spacing:.5px;

}

td{

    padding:15px;

    text-align:center;

    border-bottom:1px solid #e8eefc;

}

tbody tr{

    transition:.3s;

}

tbody tr:nth-child(even){

    background:#f8fbff;

}

tbody tr:hover{

    background:#edf4ff;

}

td img{

    width:55px;

    height:55px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #2563eb;

}

/*======================
FOOTER
=======================*/

.footer{

    margin-top:40px;

    text-align:center;

    color:#666;

    font-size:15px;

    padding-top:20px;

    border-top:1px solid #ddd;

}

/*======================
ANIMATIONS
=======================*/

.container{

    animation:fadeUp .8s ease;

}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

/*======================
RESPONSIVE
=======================*/

@media(max-width:768px){

.topbar h1{

    font-size:1.8rem;

}

.container{

    padding:20px;

}

.container h2{

    font-size:24px;

}

.button-group{

    flex-direction:column;

}

.btn{

    width:100%;

}

.card h2{

    font-size:30px;

}

th,td{

    font-size:13px;

    padding:12px;

}

}

</style>

</head>
